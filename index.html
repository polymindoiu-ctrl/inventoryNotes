<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Inventory Notes Mobile</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Menghentikan auto-zoom iOS & kenyamanan touch target */
    input, select, textarea, button {
      font-size: 16px !important;
    }
    .touch-target {
      min-height: 44px;
      min-width: 44px;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen pb-20">

  <!-- HEADER -->
  <header class="bg-slate-900 text-white sticky top-0 z-10 shadow-md">
    <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
      <div>
        <h1 class="font-bold text-lg leading-tight">Inventory Notes</h1>
        <p class="text-xs text-slate-400">Pencatatan Issue Material</p>
      </div>
      <button onclick="openSettingsModal()" class="touch-target p-2 text-slate-300 hover:text-white flex items-center justify-center">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="max-w-md mx-auto p-4 space-y-4">
    
    <!-- NOTIFIKASI API UNSET -->
    <div id="apiAlert" class="hidden bg-amber-50 border-l-4 border-amber-500 p-4 rounded-r shadow-sm">
      <div class="flex items-start">
        <div class="ml-3">
          <p class="text-sm text-amber-700 font-medium">URL API Belum Dikonfigurasi</p>
          <p class="text-xs text-amber-600 mt-1">Silakan masukkan link deploy Apps Script Anda melalui menu Pengaturan.</p>
          <button onclick="openSettingsModal()" class="mt-2 text-xs bg-amber-600 text-white font-semibold px-3 py-1.5 rounded shadow-sm touch-target">Atur URL API</button>
        </div>
      </div>
    </div>

    <!-- SEARCH & REFRESH BAR -->
    <div class="flex gap-2">
      <input type="text" id="searchInput" oninput="renderList()" placeholder="Cari material / issue..." class="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-slate-800">
      <button onclick="fetchData()" class="touch-target px-4 py-2 bg-slate-800 text-white rounded-lg font-medium shadow-sm active:bg-slate-900 flex items-center justify-center">
        <svg id="refreshIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
        </svg>
      </button>
    </div>

    <!-- TOAST NOTIFICATION FOR COPY -->
    <div id="toast" class="fixed top-20 left-1/2 transform -translate-x-1/2 bg-slate-900 text-white text-xs px-4 py-2 rounded-full shadow-lg opacity-0 transition-opacity pointer-events-none z-50">
      Berhasil disalin ke clipboard!
    </div>

    <!-- DATA LIST -->
    <div id="dataContainer" class="space-y-4">
      <!-- Loading State default -->
      <div class="text-center py-10 text-slate-400">
        <p>Memuat data...</p>
      </div>
    </div>

  </main>

  <!-- FLOATING ACTION BUTTON (FAB) -->
  <button onclick="openFormModal()" class="fixed bottom-6 right-6 w-14 h-14 bg-blue-600 text-white rounded-full shadow-lg flex items-center justify-center text-2xl font-bold active:scale-95 transition-transform touch-target z-20">
    +
  </button>

  <!-- MODAL FORM (CREATE / UPDATE) -->
  <div id="formModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden z-30 flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-5 shadow-xl space-y-4">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 id="modalTitle" class="font-bold text-lg text-slate-800">Tambah Data Notes</h3>
        <button onclick="closeFormModal()" class="text-slate-400 hover:text-slate-600 p-1 touch-target">✕</button>
      </div>
      <form id="noteForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
        <input type="hidden" id="noteId">
        
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Tanggal</label>
          <input type="date" id="inputTanggal" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Material</label>
          <input type="text" id="inputMaterial" required placeholder="Contoh: ABS Natural Grade A" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Issue / Catatan</label>
          <textarea id="inputIssue" rows="3" required placeholder="Deskripsi kendala atau masalah material..." class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
        </div>

        <div class="flex gap-2 pt-2">
          <button type="button" onclick="closeFormModal()" class="w-1/2 py-2.5 border border-slate-300 rounded-lg font-medium text-slate-600 touch-target">Batal</button>
          <button type="submit" id="btnSubmit" class="w-1/2 py-2.5 bg-blue-600 text-white rounded-lg font-medium shadow-sm active:bg-blue-700 touch-target">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL SETTINGS (API URL) -->
  <div id="settingsModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden z-40 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-2xl p-5 shadow-xl space-y-4">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="font-bold text-lg text-slate-800">Pengaturan API</h3>
        <button onclick="closeSettingsModal()" class="text-slate-400 hover:text-slate-600 p-1 touch-target">✕</button>
      </div>
      <div class="space-y-3">
        <label class="block text-xs font-semibold text-slate-600">Google Apps Script Web App URL</label>
        <textarea id="apiUrlInput" rows="4" placeholder="https://script.google.com/macros/s/.../exec" class="w-full p-2.5 text-xs border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-800 font-mono"></textarea>
        <p class="text-[11px] text-slate-500">Pastikan URL berakhiran `/exec` dan deployment GAS disetel ke *Anyone*.</p>
      </div>
      <div class="flex gap-2 pt-2">
        <button onclick="closeSettingsModal()" class="w-1/2 py-2.5 border border-slate-300 rounded-lg font-medium text-slate-600 touch-target">Batal</button>
        <button onclick="saveApiUrl()" class="w-1/2 py-2.5 bg-slate-900 text-white rounded-lg font-medium shadow-sm touch-target">Simpan</button>
      </div>
    </div>
  </div>

  <script>
    // State Management
    let inventoryData = [];
    let apiUrl = localStorage.getItem('GAS_API_URL') || '';

    // Initialize App
    document.addEventListener('DOMContentLoaded', () => {
      if (!apiUrl) {
        document.getElementById('apiAlert').classList.remove('hidden');
        document.getElementById('dataContainer').innerHTML = '<div class="text-center py-10 text-slate-400"><p>Konfigurasi URL API terlebih dahulu.</p></div>';
      } else {
        fetchData();
      }
    });

    // Helper: Modal API Settings
    function openSettingsModal() {
      document.getElementById('apiUrlInput').value = apiUrl;
      document.getElementById('settingsModal').classList.remove('hidden');
    }
    function closeSettingsModal() {
      document.getElementById('settingsModal').classList.add('hidden');
    }
    function saveApiUrl() {
      const url = document.getElementById('apiUrlInput').value.trim();
      if (url) {
        apiUrl = url;
        localStorage.setItem('GAS_API_URL', url);
        document.getElementById('apiAlert').classList.add('hidden');
        closeSettingsModal();
        fetchData();
      }
    }

    // HTTP Helper untuk GAS (Mengatasi CORS & JSON Body)
    async function requestGAS(action, payload = {}) {
      if (!apiUrl) {
        alert('URL API belum disetel!');
        return null;
      }

      try {
        if (action === 'GET') {
          const res = await fetch(apiUrl);
          return await res.json();
        } else {
          const res = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: action, ...payload })
          });
          return await res.json();
        }
      } catch (err) {
        console.error('API Error:', err);
        alert('Gagal terhubung ke Apps Script: ' + err.message);
        return null;
      }
    }

    // READ: Get All Data
    async function fetchData() {
      const refreshIcon = document.getElementById('refreshIcon');
      refreshIcon.classList.add('animate-spin');
      
      const res = await requestGAS('GET');
      refreshIcon.classList.remove('animate-spin');

      if (res && res.success) {
        inventoryData = res.data || [];
        renderList();
      }
    }

    // RENDER: Render list data dikelompokkan berdasarkan tanggal
    function renderList() {
      const container = document.getElementById('dataContainer');
      const search = document.getElementById('searchInput').value.toLowerCase();

      const filtered = inventoryData.filter(item => {
        const mat = (item.nama_material || '').toLowerCase();
        const iss = (item.issue || '').toLowerCase();
        const tgl = (item.tanggal || '').toLowerCase();
        return mat.includes(search) || iss.includes(search) || tgl.includes(search);
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12 bg-white rounded-xl border border-slate-200">
            <p class="text-slate-400 text-sm">Tidak ada data ditemukan</p>
          </div>`;
        return;
      }

      // Kelompokkan data berdasarkan tanggal
      const grouped = {};
      filtered.forEach(item => {
        const rawDate = item.tanggal ? item.tanggal.split('T')[0] : 'Tanpa Tanggal';
        if (!grouped[rawDate]) {
          grouped[rawDate] = [];
        }
        grouped[rawDate].push(item);
      });

      // Urutkan tanggal secara descending (terbaru ke terlama)
      const sortedDates = Object.keys(grouped).sort((a, b) => new Date(b) - new Date(a));

      container.innerHTML = sortedDates.map(dateKey => {
        const itemsInDate = grouped[dateKey];
        const displayDate = formatDateDisplay(dateKey);

        const itemsHtml = itemsInDate.map(item => `
          <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 space-y-1 relative">
            <div class="flex justify-between items-start">
              <h4 class="font-bold text-slate-800 text-base leading-snug">${escapeHtml(item.nama_material || '-')}</h4>
              <div class="flex gap-2">
                <button onclick="editNote('${item.id}')" class="text-slate-400 hover:text-blue-600 text-xs font-medium p-1 touch-target">Edit</button>
                <button onclick="deleteNote('${item.id}')" class="text-slate-400 hover:text-red-600 text-xs font-medium p-1 touch-target">Hapus</button>
              </div>
            </div>
            <p class="text-slate-600 text-sm whitespace-pre-line leading-relaxed">${escapeHtml(item.issue || '-')}</p>
          </div>
        `).join('');

        return `
          <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
            <!-- Header Card per Tanggal + Tombol Copy -->
            <div class="flex justify-between items-center border-b border-slate-100 pb-2">
              <span class="text-xs font-bold text-blue-600 bg-blue-50 px-2.5 py-1 rounded-md">
                📅 ${displayDate}
              </span>
              <button onclick="copyWhatsAppFormat('${dateKey}')" class="touch-target px-3 py-1 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-medium rounded-lg flex items-center gap-1.5 shadow-sm active:scale-95 transition-transform">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path>
                </svg>
                Copy WA
              </button>
            </div>
            <!-- Daftar Material di Tanggal Tersebut -->
            <div class="space-y-2">
              ${itemsHtml}
            </div>
          </div>
        `;
      }).join('');
    }

    // COPY FORMAT WHATSAPP BERDASARKAN TANGGAL
    function copyWhatsAppFormat(dateKey) {
      const itemsInDate = inventoryData.filter(item => {
        const itemDate = item.tanggal ? item.tanggal.split('T')[0] : 'Tanpa Tanggal';
        return itemDate === dateKey;
      });

      if (itemsInDate.length === 0) return;

      const displayDate = formatDateDisplay(dateKey);

      // Gabungkan material dan issue
      let detailsText = itemsInDate.map(item => {
        const mat = item.nama_material || '-';
        const iss = item.issue || '-';
        return `*${mat}*\n${iss}`;
      }).join('\n\n');

      const waText = `Dear team,\n\nBerikut isu material tanggal ${displayDate} :\n\n${detailsText}\n\n*Catatan :*\nUntuk penggunaan bag FR pastikan bag sebelumnya sudah habis\n\nDemikian terima kasih\n\n#InventoryNotes #InventoryProduksi #Sutopo`;

      // Salin ke clipboard
      navigator.clipboard.writeText(waText).then(() => {
        showToast();
      }).catch(err => {
        console.error('Gagal menyalin: ', err);
        alert('Gagal menyalin teks.');
      });
    }

    // TOAST NOTIFICATION HELPER
    function showToast() {
      const toast = document.getElementById('toast');
      toast.classList.remove('opacity-0');
      setTimeout(() => {
        toast.classList.add('opacity-0');
      }, 2000);
    }

    // CREATE & UPDATE: Submit Handler
    async function handleFormSubmit(e) {
      e.preventDefault();
      const btnSubmit = document.getElementById('btnSubmit');
      btnSubmit.disabled = true;
      btnSubmit.innerText = 'Menyimpan...';

      const id = document.getElementById('noteId').value;
      const tanggal = document.getElementById('inputTanggal').value;
      const nama_material = document.getElementById('inputMaterial').value;
      const issue = document.getElementById('inputIssue').value;

      const action = id ? 'update' : 'create';
      const payload = { id, tanggal, nama_material, issue };

      const res = await requestGAS(action, payload);

      btnSubmit.disabled = false;
      btnSubmit.innerText = 'Simpan';

      if (res && res.success) {
        closeFormModal();
        fetchData();
      } else {
        alert(res ? res.message : 'Gagal menyimpan data');
      }
    }

    // DELETE: Delete Handler
    async function deleteNote(id) {
      if (!confirm('Apakah Anda yakin ingin menghapus data ini?')) return;
      
      const res = await requestGAS('delete', { id });
      if (res && res.success) {
        fetchData();
      } else {
        alert(res ? res.message : 'Gagal menghapus data');
      }
    }

    // Modal Helpers (Form)
    function openFormModal() {
      document.getElementById('modalTitle').innerText = 'Tambah Data Notes';
      document.getElementById('noteId').value = '';
      document.getElementById('noteForm').reset();
      document.getElementById('inputTanggal').value = new Date().toISOString().split('T')[0];
      document.getElementById('formModal').classList.remove('hidden');
    }

    function editNote(id) {
      const item = inventoryData.find(d => String(d.id) === String(id));
      if (!item) return;

      document.getElementById('modalTitle').innerText = 'Edit Data Notes';
      document.getElementById('noteId').value = item.id;
      document.getElementById('inputTanggal').value = formatDateForInput(item.tanggal);
      document.getElementById('inputMaterial').value = item.nama_material || '';
      document.getElementById('inputIssue').value = item.issue || '';
      
      document.getElementById('formModal').classList.remove('hidden');
    }

    function closeFormModal() {
      document.getElementById('formModal').classList.add('hidden');
    }

    // Utility Functions
    function formatDateDisplay(dateStr) {
      if (!dateStr) return '-';
      const d = new Date(dateStr);
      return isNaN(d) ? dateStr : d.toLocaleDateString('id-ID', { year: 'numeric', month: 'short', day: 'numeric' });
    }

    function formatDateForInput(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      return isNaN(d) ? dateStr : d.toISOString().split('T')[0];
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
